# CI: typecheck + tests on every push to main, every pull request, and a
# daily schedule. This is a pure zero-dependency lib (no dsh host closure to
# track), so the workflow is deliberately lean — no dsh CLI boot smoke, no
# closure linking. The tests run against the built lib/ (pretest builds), so
# the published surface is what gets tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:33 UTC — catches Node/toolchain drift.
    - cron: '33 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Test (pretest builds lib/)
        run: npm test
